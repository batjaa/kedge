# Kedge preview deployment (issue #27) — single-origin topology on Coolify.
# An early, minimal prototype of the M7 self-host shape: one public origin,
# Caddy routes API paths to Laravel and everything else to Next.
#
# Env (set by Coolify at runtime): APP_URL, APP_KEY, DB_DATABASE, DB_USERNAME, DB_PASSWORD.
# Defaults (not :? requires) because Coolify interpolates the file at BUILD time
# with only build-time vars present — hard requires fail the build.
# Build contexts are REPO-ROOT-relative: Coolify runs compose with
# --project-directory <repo root>. Locally: docker compose --project-directory . -f deploy/preview/compose.yml ...
# Everything else defaults sensibly; SANCTUM_STATEFUL_DOMAINS and FRONTEND_URL
# are derived from APP_URL by the api entrypoint when unset.

x-api-env: &api-env
  APP_NAME: ${APP_NAME:-Kedge}
  APP_ENV: ${APP_ENV:-production}
  APP_DEBUG: ${APP_DEBUG:-false}
  APP_URL: ${APP_URL:-}
  APP_KEY: ${APP_KEY:-}
  LOG_CHANNEL: ${LOG_CHANNEL:-stderr}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DB_CONNECTION: pgsql
  DB_HOST: db
  DB_PORT: 5432
  DB_DATABASE: ${DB_DATABASE:-kedge}
  DB_USERNAME: ${DB_USERNAME:-kedge}
  DB_PASSWORD: ${DB_PASSWORD:-}
  CACHE_STORE: database
  QUEUE_CONNECTION: database
  SESSION_DRIVER: database
  SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-true}
  SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:-}
  FRONTEND_URL: ${FRONTEND_URL:-}
  SELF_HOSTED: ${SELF_HOSTED:-true}
  GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
  GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
  PROJECTION_URL: http://web:3000
  PROJECTION_SHARED_SECRET: ${PROJECTION_SHARED_SECRET:-}
  KROKI_URL: http://kroki:8000
  DIAGRAM_SHARED_SECRET: ${DIAGRAM_SHARED_SECRET:-}

x-api-build: &api-build
  context: ./api
  dockerfile: Dockerfile

services:
  proxy:
    build:
      context: ./deploy/preview/proxy
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - api
      - web
    expose:
      - "80"

  api:
    build: *api-build
    restart: unless-stopped
    environment:
      <<: *api-env
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
    expose:
      - "80"
    healthcheck:
      # Healthy only once migrations have run and the app answers — workers
      # gate on this so they never race the first boot's migrations.
      test: ["CMD", "wget", "-qO/dev/null", "http://127.0.0.1:80/up"]
      interval: 5s
      timeout: 5s
      retries: 30
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: *api-build
    command: ["worker"]
    restart: unless-stopped
    environment:
      <<: *api-env
      RUN_MIGRATIONS: "false"
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy

  scheduler:
    build: *api-build
    command: ["scheduler"]
    restart: unless-stopped
    environment:
      <<: *api-env
      RUN_MIGRATIONS: "false"
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      API_URL: http://api:80
      PROJECTION_SHARED_SECRET: ${PROJECTION_SHARED_SECRET:-}
      DIAGRAM_SHARED_SECRET: ${DIAGRAM_SHARED_SECRET:-}
    expose:
      - "3000"
    depends_on:
      - api

  kroki:
    # Pinned to match CI (ticket #26). The core image DELEGATES mermaid, bpmn,
    # and excalidraw to companion containers (#49) — without them those engines
    # 500 while plantuml/graphviz work.
    image: yuzutech/kroki:0.31.0
    restart: unless-stopped
    environment:
      KROKI_MERMAID_HOST: kroki-mermaid
      KROKI_BPMN_HOST: kroki-bpmn
      KROKI_EXCALIDRAW_HOST: kroki-excalidraw
    expose:
      - "8000"
    depends_on:
      - kroki-mermaid
      - kroki-bpmn
      - kroki-excalidraw

  kroki-mermaid:
    image: yuzutech/kroki-mermaid:0.31.0
    restart: unless-stopped
    expose:
      - "8002"

  kroki-bpmn:
    image: yuzutech/kroki-bpmn:0.31.0
    restart: unless-stopped
    expose:
      - "8003"

  kroki-excalidraw:
    image: yuzutech/kroki-excalidraw:0.31.0
    restart: unless-stopped
    expose:
      - "8004"

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-kedge}
      POSTGRES_USER: ${DB_USERNAME:-kedge}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-kedge} -d ${DB_DATABASE:-kedge}"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
