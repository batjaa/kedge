# Kedge — one-command local run (issue #41).
#
#   ./deploy/local/up.sh          # generates .env on first run, builds, starts
#   → http://localhost:8080       # (KEDGE_PORT in deploy/local/.env to change)
#
# Standalone: no platform assumptions, everything bundled (postgres + kroki),
# SELF_HOSTED=true (no demo surface). This is the M7 reference deployment's
# early slice — M7 proper adds tagged images, FrankenPHP, and backup/upgrade docs.
#
# Build contexts are relative to THIS FILE's directory (docker compose default),
# so `docker compose -f deploy/local/compose.yml <cmd>` works from anywhere.
# Env comes from deploy/local/.env (generated by up.sh, gitignored).

x-api-env: &api-env
  APP_NAME: ${APP_NAME:-Kedge}
  APP_ENV: production
  APP_DEBUG: ${APP_DEBUG:-false}
  APP_URL: ${APP_URL:-http://localhost:8080}
  APP_KEY: ${APP_KEY:-}
  LOG_CHANNEL: stderr
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DB_CONNECTION: pgsql
  DB_HOST: db
  DB_PORT: 5432
  DB_DATABASE: ${DB_DATABASE:-kedge}
  DB_USERNAME: ${DB_USERNAME:-kedge}
  DB_PASSWORD: ${DB_PASSWORD:-}
  CACHE_STORE: database
  QUEUE_CONNECTION: database
  SESSION_DRIVER: database
  # Plain http on a local/LAN machine — no TLS, so the cookie must not be Secure.
  SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-false}
  SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:-}
  FRONTEND_URL: ${FRONTEND_URL:-}
  SELF_HOSTED: "true"
  GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
  GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
  PROJECTION_URL: http://web:3000
  PROJECTION_SHARED_SECRET: ${PROJECTION_SHARED_SECRET:-}
  KROKI_URL: http://kroki:8000
  DIAGRAM_SHARED_SECRET: ${DIAGRAM_SHARED_SECRET:-}

x-api-build: &api-build
  context: ../../api
  dockerfile: Dockerfile

services:
  proxy:
    build:
      context: ../preview/proxy
      dockerfile: Dockerfile
    depends_on:
      - api
      - web
    ports:
      - "${KEDGE_PORT:-8080}:80"

  api:
    build: *api-build
    environment:
      <<: *api-env
      RUN_MIGRATIONS: "true"
    expose:
      - "80"
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: *api-build
    command: ["worker"]
    environment:
      <<: *api-env
      RUN_MIGRATIONS: "false"
    depends_on:
      db:
        condition: service_healthy

  scheduler:
    build: *api-build
    command: ["scheduler"]
    environment:
      <<: *api-env
      RUN_MIGRATIONS: "false"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ../../web
      dockerfile: Dockerfile
    environment:
      API_URL: http://api:80
      PROJECTION_SHARED_SECRET: ${PROJECTION_SHARED_SECRET:-}
      DIAGRAM_SHARED_SECRET: ${DIAGRAM_SHARED_SECRET:-}
    expose:
      - "3000"
    depends_on:
      - api

  kroki:
    image: yuzutech/kroki:latest
    expose:
      - "8000"

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-kedge}
      POSTGRES_USER: ${DB_USERNAME:-kedge}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-kedge} -d ${DB_DATABASE:-kedge}"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
