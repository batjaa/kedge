name: CI

# Every push to main and every pull request is verified automatically.
# A red run blocks the change visibly. No secrets or paid services required.
on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only reads the checked-out code.
permissions:
  contents: read

# Newer pushes to the same ref cancel superseded in-progress runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (Pint + PHPUnit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, sqlite3, mbstring
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-${{ hashFiles('api/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Check code style (Pint)
        run: vendor/bin/pint --test

      - name: Run tests (PHPUnit)
        run: php artisan test

  web:
    name: Web (types:check + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run types:check

      # Golden projection conformance corpus + pipeline unit tests (SPEC §5.4,
      # §18.2). A pipeline change that alters any projection fails here until the
      # goldens are regenerated intentionally (`npm run test:update`) alongside a
      # projection_version bump.
      - name: Projection tests (Vitest)
        run: npm test

      # Guards the production build: types:check never exercises `next build`,
      # so prerender regressions (e.g. the /_global-error build failure) slip
      # through unless the build itself runs in CI.
      - name: Production build
        run: npm run build

  e2e:
    name: E2E (Playwright journeys)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # The diagram journeys render mermaid through Kroki (SPEC 6.2). CI must
    # never call hosted kroki.io, so the job runs its own: the core Kroki
    # container plus the mermaid companion it delegates mermaid rendering to
    # (they talk over the Actions service network by service name). The API is
    # pointed at it via KROKI_URL on the run step below; a local run instead
    # uses the dev default (hosted kroki.io) unless KROKI_URL is exported.
    services:
      kroki:
        image: yuzutech/kroki:0.31.0
        env:
          KROKI_MERMAID_HOST: kroki-mermaid
        ports:
          - 8001:8000
      kroki-mermaid:
        image: yuzutech/kroki-mermaid:0.31.0

    steps:
      - uses: actions/checkout@v4

      # Both deployables run in this one job: the journey is the only proof the
      # cross-app cookie handshake works, so it needs the real API and web app.
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, sqlite3, mbstring
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-${{ hashFiles('api/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install API dependencies
        working-directory: api
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      # The Chromium download is ~2.5 minutes of the job when fetched fresh, so
      # the browser bundle is cached keyed on the exact Playwright version (a
      # lockfile hash would churn the cache on every unrelated dep bump). On a
      # hit only the apt-installed system libraries are (re)applied — those live
      # outside the cached directory.
      - name: Resolve Playwright version
        id: playwright-version
        working-directory: web
        run: |
          echo "version=$(node -e "console.log(require('./package-lock.json').packages['node_modules/@playwright/test'].version)")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: web
        run: npx playwright install-deps chromium

      # Boots api (scratch SQLite, migrated fresh) + web + the loopback fixture
      # host via playwright.config.ts, drives the journey pack (#39) across every
      # shipped surface — the M0 handshake and M1 paste→render→share→claim plus
      # auth edges, URL/paste/HTML import + failures + warnings, MDX safety, the
      # share lifecycle, diagrams, and PAT settings — then tears everything down.
      # A failure fails the build. KROKI_URL reaches serve-api.sh through the
      # environment and lands in the generated .env.e2e, pointing diagram renders
      # at the job's Kroki service instead of kroki.io.
      - name: Run the journey pack
        working-directory: web
        run: npm run e2e
        env:
          KROKI_URL: http://127.0.0.1:8001

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7
